name: Wanderlust CD

on:
  workflow_run:
    workflows: ["Wanderlust CI"]
    types:
      - completed

jobs:

  docker-push:
    name: Push Docker Images
    runs-on: ubuntu-latest

    # Only run CD if CI succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/wanderlust-backend:${{ github.event.workflow_run.head_sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/wanderlust-backend:latest \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/wanderlust-frontend:${{ github.event.workflow_run.head_sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/wanderlust-frontend:latest \
            ./frontend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/wanderlust-backend:${{ github.event.workflow_run.head_sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/wanderlust-backend:latest

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/wanderlust-frontend:${{ github.event.workflow_run.head_sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/wanderlust-frontend:latest
